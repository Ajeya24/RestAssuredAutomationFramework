

name: API Automation Rest Assured project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: 00 18 * * *
    - cron: 00 2 * * *

jobs:
  build:

    runs-on: ubuntu-latest
    permissions: 
     contents: read
     checks: write
     issues: write
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Execute Tests
      run: mvn clean test -Dsuite=suite -X

    - name: Upload a Build Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with: 
       name: Logs
       path: logs/
    
    - name: Publish Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
       name: TestNG Results
       path: target/surefire-reports/junitreports/TEST-*.xml
       reporter: java-junit
       
      
